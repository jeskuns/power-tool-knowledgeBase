<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标准库 · 知识库门户</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>安规 / EMC 标准库</h1>
    <p>电动工具与园林工具安规、EMC 现行有效标准清单（50 条），来源：电动工具测试标准与认证知识库。每条显示状态与库内原件情况。</p>
    <div class="meta">数据来源：电动工具测试标准与认证知识库/00_索引/现行标准清单.md（2026-11-11 生成）</div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tabs" id="tabs"></div>
  <table class="tbl">
    <thead><tr><th>标准号</th><th>名称</th><th>状态</th><th>实施</th><th>代替</th><th>库内</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="note">注：库内「库中缺 / 仅旧版」表示标准库尚缺该标准最新版原件；标记为「国际参考」的 IEC/CISPR 不纳入国内比对。完整 2119 份标准原件与全文检索见 <a href="电动工具测试标准与认证知识库/查询.html">电动工具测试标准与认证知识库查询页</a>。</div>
  <footer>工程部数字化 · 知识库门户 ｜ 标准库完整内容在电动工具测试标准与认证知识库</footer>
</div>
<script src="assets/data/standards.js"></script>
<script>
  var STAT = window.STD_STAT, S = window.STANDARDS;
  var GS = STAT.groupSummary;
  document.getElementById("stats").innerHTML =
    '<div class="stat"><div class="n">' + STAT.total + '</div><div class="l">现行/即将实施</div></div>' +
    '<div class="stat"><div class="n">' + GS['电动工具安规'] + '</div><div class="l">电动工具安规</div></div>' +
    '<div class="stat"><div class="n">' + GS['园林工具安规'] + '</div><div class="l">园林工具安规</div></div>' +
    '<div class="stat"><div class="n">' + GS['EMC'] + '</div><div class="l">EMC</div></div>' +
    '<div class="stat"><div class="n">' + GS['通用/管理/电池'] + '</div><div class="l">通用/管理/电池</div></div>' +
    '<div class="stat"><div class="n">' + GS['国际参考'] + '</div><div class="l">国际参考</div></div>';
  var groups = Object.keys(GS);
  var tabs = document.getElementById("tabs");
  tabs.innerHTML = ["全部"].concat(groups).map(function (g) { return '<button data-g="' + g + '">' + g + '</button>'; }).join("");
  function pill(v) {
    if (v.indexOf("已有原件") >= 0) return '<span class="pill ok">已有原件</span>';
    if (v.indexOf("缺") >= 0) return '<span class="pill todo">库中缺</span>';
    if (v.indexOf("旧版") >= 0) return '<span class="pill warn">仅旧版</span>';
    if (v.indexOf("国际参考") >= 0) return '<span class="pill soon">国际参考</span>';
    return v;
  }
  function render(g) {
    var rows = S.filter(function (s) { return g === "全部" || s.group.indexOf(g) >= 0; });
    document.getElementById("rows").innerHTML = rows.map(function (s) {
      return '<tr><td><b>' + s.code + '</b></td><td>' + s.name + '</td>' +
        '<td>' + (s.status || '') + '</td><td>' + (s.implement || '') + '</td>' +
        '<td>' + (s.replaces || '—') + '</td><td>' + pill(s.inLib) + '</td></tr>';
    }).join("");
  }
  tabs.querySelectorAll("button").forEach(function (btn) {
    btn.onclick = function () {
      tabs.querySelectorAll("button").forEach(function (x) { x.classList.remove("active"); });
      btn.classList.add("active"); render(btn.dataset.g);
    };
  });
  tabs.querySelector("button").classList.add("active");
  render("全部");
</script>
<script src="assets/js/nav.js"></script>
</body>
</html>
