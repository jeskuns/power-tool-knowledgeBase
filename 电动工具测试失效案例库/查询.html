<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>电动工具测试失效案例库 · 案例查询</title>
<style>
:root{
  --ink:#132029; --ink2:#4a5c68; --line:#d7dfe4; --bg:#f4f6f8; --card:#fff;
  --primary:#1f4e5f; --primary-d:#143643; --gold:#a8712a; --gold-l:#f3e4cf;
  --ok:#1c6b3f; --bad:#a32020; --warn:#8a5a12;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);
  font:16px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
a{color:var(--primary);text-decoration:none}
a:active,a:hover{color:var(--gold)}

.topbar{background:var(--primary);color:#fff;padding:10px 14px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.topbar a{color:#cfe3ea;font-size:14px}
.topbar b{font-size:17px;letter-spacing:.5px}

.searchwrap{position:sticky;top:0;z-index:20;background:var(--primary-d);padding:10px 14px 12px;
  box-shadow:0 2px 8px rgba(0,0,0,.22)}
.sbox{display:flex;gap:8px}
.sbox input{flex:1;min-width:0;font-size:18px;padding:13px 14px;border:2px solid #fff;
  border-radius:10px;background:#fff;color:var(--ink);outline:none}
.sbox input::placeholder{color:#7c8b95}
.sbox button{border:0;border-radius:10px;background:var(--gold);color:#fff;font-size:16px;
  padding:0 18px;cursor:pointer}
.sbox button:active{background:#8d5d1f}
.tabs{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tab{border:1px solid rgba(255,255,255,.5);color:#e7f0f4;background:transparent;
  border-radius:999px;padding:6px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:#fff;color:var(--primary-d);border-color:#fff;font-weight:600}
.tab small{opacity:.7;margin-left:4px}
.hint{color:#cfe3ea;font-size:13px;margin-top:8px}
.hint b{color:#fff}

.chips{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px 0}
.chip{background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 11px;
  font-size:13px;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip small{color:var(--gold);font-weight:700;margin-left:3px}
.chip.on small{color:#ffd9a0}

main{padding:12px 14px 40px;max-width:1180px;margin:0 auto}
.group{background:var(--card);border:1px solid var(--line);border-radius:12px;
  margin-bottom:14px;overflow:hidden}
.ghead{display:flex;align-items:baseline;gap:10px;padding:10px 14px;
  background:#eef3f6;border-bottom:1px solid var(--line);cursor:pointer}
.ghead h2{margin:0;font-size:16px;color:var(--primary-d)}
.ghead .cnt{font-size:13px;color:var(--gold);font-weight:700}
.ghead .more{margin-left:auto;font-size:13px;color:var(--ink2)}

.row{padding:11px 14px;border-bottom:1px solid #eaf0f3;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:#f8fbfc}
.row .l1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.row .key{font-weight:700;font-size:16px;color:var(--primary-d);word-break:break-all}
.row .title{flex:1;min-width:180px;color:var(--ink);word-break:break-word}
.row .l2{margin-top:3px;font-size:13px;color:var(--ink2);display:flex;gap:6px 14px;flex-wrap:wrap}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;
  background:#e7eef2;color:var(--primary-d);border:1px solid #cfdde4;white-space:nowrap}
.badge.cn{background:var(--gold-l);border-color:#e0c9a4;color:#6f4a12}
.badge.fg{background:#e5eef7;border-color:#c3d7ea;color:#1c4a76}
.badge.ok{background:#e3f2e8;border-color:#bcdcc8;color:var(--ok)}
.badge.bad{background:#fbe9e9;border-color:#eec7c7;color:var(--bad)}
.badge.warn{background:#fbf2e0;border-color:#ecdcb8;color:var(--warn)}
.detail{background:#f7fafb;border-top:1px dashed var(--line);padding:10px 14px;font-size:14px}
.detail dl{display:grid;grid-template-columns:104px 1fr;gap:4px 10px;margin:0 0 8px}
.detail dt{color:var(--ink2);font-size:13px}
.detail dd{margin:0;word-break:break-word}
.detail pre{white-space:pre-wrap;margin:0;font:13px/1.55 ui-monospace,Consolas,monospace;
  background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-height:280px;overflow:auto}
.cbox{margin:9px 0 0;padding:9px 11px;border-radius:8px;font-size:13.5px;line-height:1.6;
  background:#eaf4f7;border:1px solid #a9cdd8;color:#143643}
.cbox b{font-size:14px;display:block;margin-bottom:3px}
.cbox.ok{background:#eaf4ea;border-color:#bcdcc8;color:#1c5230}
.badge.res-bad{background:#fbe9e9;border-color:#eec7c7;color:var(--bad);font-weight:700}
.badge.res-warn{background:#fbf2e0;border-color:#ecdcb8;color:var(--warn);font-weight:700}
.badge.res-ok{background:#e3f2e8;border-color:#bcdcc8;color:var(--ok)}
.case-no{font-size:12px;color:var(--ink2);margin-left:6px}
mark{background:#ffe9a8;color:#5a3f00;padding:0 1px;border-radius:2px}
.pager{padding:12px;text-align:center}
.pager button{background:var(--primary);color:#fff;border:0;border-radius:8px;
  padding:9px 20px;font-size:15px;cursor:pointer}
.empty{padding:26px 14px;text-align:center;color:var(--ink2)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.foot{padding:16px 14px 40px;color:var(--ink2);font-size:13px;text-align:center}
.foot code{background:#e7eef2;padding:1px 6px;border-radius:4px;color:var(--primary-d)}

@media (max-width:640px){
  .sbox input{font-size:17px}
  .row .title{min-width:0;flex-basis:100%;order:5}
  .detail dl{grid-template-columns:88px 1fr}
}
</style>
</head>
<body>
<div class="topbar">
  <b>电动工具测试失效案例库 · 案例查询</b>
  <a href="javascript:history.back()">返回</a>
</div>

<div class="searchwrap">
  <div class="sbox">
    <input id="q" type="search" autocomplete="off" spellcheck="false"
           placeholder="输入型号 / 报告编号 / 合同编号 / 委托人 / 部门，直接出案例">
    <button id="go" type="button">查询</button>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="hint" id="hint"></div>
</div>

<div class="chips" id="chips"></div>
<main id="out"></main>
<div class="foot">
  数据离线内置在本项目文件夹里，手机无网络也能查。整个文件夹拷走照样能用。<br>
  更新数据：把新的导出件覆盖 <code>失效案例库.txt</code>，重跑 <code>python build.py</code> 即可。
</div>

<script src="查询数据/records.js"></script>
<script>
(function(){
"use strict";
var KB = window.KB || {};
var PAGE = 120;

var rows = (KB.records && KB.records.rows) || [];
var META = (KB.records && KB.records.meta) || {};

/* ---------- 预处理 ---------- */
function hay(r){
  return [r.src,r.no,r.dept,r.who,r.model,r.qty,r.item,r.purpose,r.date,r.tester,
          r.prog,r.due,r.done,r.rpt,r.res,r.submit,r.day,r.note,r.phenom,r.cause,r.avoid].join(" ").toLowerCase();
}
function compact(s){ return String(s||"").toLowerCase().replace(/[^0-9a-z\u4e00-\u9fff]+/g,""); }
rows.forEach(function(r,i){
  r._h = hay(r);
  r._hc = compact(r._h);
  r._i = i;
  // 归一测试结果用于着色：不合格红、余量小/待定黄、其余绿
  var res = (r.res||"").trim();
  r._rc = res==="不合格" ? "bad" : (res==="余量小"||res==="待定") ? "warn" : "ok";
});

/* ---------- 测试项目（tab）---------- */
var ITEM_ORDER = [], ITEM_COUNT = {};
rows.forEach(function(r){
  var k = r.item || "未分类";
  if(!ITEM_COUNT[k]){ ITEM_COUNT[k]=0; ITEM_ORDER.push(k); }
  ITEM_COUNT[k]++;
});

var state = {scope:"all", q:"", tokens:[], facets:{}, shown:{}, open:{}};

/* ---------- 工具 ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function hl(s){
  var t = esc(s);
  if(!state.tokens.length) return t;
  for(var i=0;i<state.tokens.length;i++){
    var tk = state.tokens[i].replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
    if(tk.length<2) continue;
    t = t.replace(new RegExp("("+tk+")","ig"),"<mark>$1</mark>");
  }
  return t;
}
function num(v,suffix){ return v ? esc(v)+(suffix||"") : ""; }

/* ---------- 过滤 ---------- */
function matchRow(r, tokens){
  for(var i=0;i<tokens.length;i++){
    var tk = tokens[i];
    if(r._h.indexOf(tk)>=0) continue;
    var ck = compact(tk);
    if(ck.length>=2 && r._hc.indexOf(ck)>=0) continue;
    return false;
  }
  return true;
}
function facetOk(r){
  var f = state.facets;
  for(var k in f){ if(f[k].length && f[k].indexOf(r[k])<0) return false; }
  return true;
}
function query(){
  var out = [];
  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    if(state.scope!=="all" && (r.item||"未分类")!==state.scope) continue;
    if(state.tokens.length && !matchRow(r, state.tokens)) continue;
    if(!facetOk(r)) continue;
    out.push(r);
  }
  return out;
}

/* ---------- 分面 ---------- */
var FACETS = [
  {k:"res", label:"测试结果", vals:["不合格","余量小","待定","—"]},
  {k:"dept", label:"委托部门", from:"field"},
  {k:"src", label:"合同来源", vals:["TC","OA","QMS","LIMS"]}
];
function facetValues(f){
  if(f.vals) return f.vals.map(function(v){return [v, count(f.k,[v])];});
  var c = {};
  rows.forEach(function(r){ var v=r[f.k]||"—"; if(v) c[v]=(c[v]||0)+1; });
  return Object.keys(c).sort(function(a,b){return c[b]-c[a];}).slice(0,15)
    .map(function(v){return [v, c[v]];});
}
function count(fk, sel){
  var n=0;
  for(var i=0;i<rows.length;i++){
    var r=rows[i];
    if(state.scope!=="all" && (r.item||"未分类")!==state.scope) continue;
    if(sel.indexOf(r[fk]||"—")<0) continue;
    if(state.tokens.length && !matchRow(r,state.tokens)) continue;
    n++;
  }
  return n;
}

/* ---------- 行渲染 ---------- */
function rowCase(r){
  var b = ['<span class="badge '+(r._rc==="bad"?"res-bad":r._rc==="warn"?"res-warn":"res-ok")+'">'+esc(r.res||"—")+'</span>'];
  if(r.item) b.push('<span class="badge fg">'+esc(r.item)+'</span>');
  if(r.src) b.push('<span class="badge cn">'+esc(r.src)+'</span>');
  var key = r.rpt || r.no || "(无编号)";
  return '<div class="row" data-i="'+r._i+'">'+
    '<div class="l1"><span class="key">'+hl(key)+'</span>'+
    '<span class="title">'+hl(r.model)+'</span>'+
    '<span class="case-no">#'+(r._i+1)+'</span></div>'+
    '<div class="l2">'+b.join("")+
      '<span>'+esc([r.dept,r.who,r.tester].filter(Boolean).join(" · "))+'</span>'+
    '</div></div>';
}
function detailCase(r){
  var dl=[];
  function kv(k,v){ if(v) dl.push("<dt>"+k+"</dt><dd>"+esc(v)+"</dd>"); }
  kv("合同来源", r.src); kv("合同编号", r.no); kv("委托部门", r.dept);
  kv("委托人", r.who); kv("样机型号", r.model); kv("数量", r.qty);
  kv("测试项目", r.item); kv("测试目的", r.purpose);
  kv("流程安排日期", r.date); kv("测试人员", r.tester);
  kv("测试进度", r.prog); kv("预计完成", r.due); kv("实际完成", r.done);
  kv("报告编号", r.rpt); kv("测试结果", r.res);
  kv("流程提交日期", r.submit); kv("绩效(天)", r.day);
  var x = "<dl>"+dl.join("")+"</dl>";
  x += '<div class="cbox"><b>失效现象</b><br>'+esc(r.phenom||"")+'</div>';
  x += '<div class="cbox"><b>原因分析</b><br>'+esc(r.cause||"")+'</div>';
  x += '<div class="cbox ok"><b>规避措施</b><br>'+esc(r.avoid||"")+'</div>';
  if(r.note) x += '<pre>'+esc(r.note)+'</pre>';
  return x;
}

/* ---------- 渲染 ---------- */
function render(){
  var out = document.getElementById("out");
  var rowsRes = query();
  var html = "";
  var limit = state.shown._ || PAGE;
  if(!rowsRes.length){
    html = '<div class="empty"><b>没有匹配案例</b>换个写法试试（型号里的 - 和空格可以省，比如 FF-100A 直接输 FF100A）。<br>'+
      '已收录 '+rows.length+' 条案例，覆盖 '+ITEM_ORDER.length+' 个测试项目：'+ITEM_ORDER.map(esc).join("、")+'。</div>';
  } else {
    var body = rowsRes.slice(0,limit).map(rowCase).join("");
    var more = rowsRes.length>limit ?
      '<div class="pager"><button type="button" data-more="1">加载更多（还有 '+(rowsRes.length-limit)+' 条）</button></div>' : "";
    html = body + more;
  }
  out.innerHTML = html;
  document.getElementById("hint").innerHTML =
    state.tokens.length ? '“'+esc(state.q)+'” 命中 <b>'+rowsRes.length+'</b> 条案例' :
    state.scope==="all" ? '共 <b>'+rows.length+'</b> 条失效案例，按测试项目切换查看' :
    '<b>'+ITEM_COUNT[state.scope]+'</b> 条「'+esc(state.scope)+'」案例'+(anyFacet()?'（已筛选）':'');
  renderTabs(); renderChips(); restoreOpen();
}
function renderTabs(){
  var el = document.getElementById("tabs"), html="";
  html += '<button class="tab" role="tab" data-scope="all" aria-selected="'+(state.scope==="all")+'">全部<small>'+rows.length+'</small></button>';
  ITEM_ORDER.forEach(function(k){
    html += '<button class="tab" role="tab" data-scope="'+esc(k)+'" aria-selected="'+(state.scope===k)+'">'+esc(k)+'<small>'+ITEM_COUNT[k]+'</small></button>';
  });
  el.innerHTML = html;
}
function renderChips(){
  var el = document.getElementById("chips"), html="";
  FACETS.forEach(function(f){
    var sel = state.facets[f.k]||[];
    var vals = facetValues(f);
    vals.forEach(function(pair){
      if(!sel.length && pair[1]<2 && f.k!=="res" && f.k!=="src") return;
      var on = sel.indexOf(pair[0])>=0;
      html += '<button class="chip'+(on?" on":"")+'" data-fk="'+f.k+'" data-fv="'+esc(pair[0])+'">'+esc(pair[0])+'<small>'+pair[1]+'</small></button>';
    });
  });
  if(anyFacet()) html += '<button class="chip" data-clear="1">清空筛选 ×</button>';
  el.innerHTML = html;
}
function anyFacet(){
  for(var k in state.facets){ if(state.facets[k].length) return true; }
  return false;
}
function restoreOpen(){
  var out = document.getElementById("out");
  Object.keys(state.open).forEach(function(id){
    if(!state.open[id]) return;
    var row = out.querySelector('.row[data-i="'+id+'"]');
    if(!row) return;
    var div = document.createElement("div");
    div.className="detail"; div.id="d-"+id;
    div.innerHTML = detailCase(rows[+id]);
    row.parentNode.insertBefore(div, row.nextSibling);
  });
}

/* ---------- 事件 ---------- */
var t=null;
function onInput(){
  var v = document.getElementById("q").value;
  clearTimeout(t);
  t = setTimeout(function(){
    state.q = v.trim();
    state.tokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
    state.shown={}; state.open={}; render();
  }, 140);
}
document.getElementById("q").addEventListener("input", onInput);
document.getElementById("q").addEventListener("search", onInput);
document.getElementById("go").addEventListener("click", function(){
  state.q = document.getElementById("q").value.trim();
  state.tokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  state.shown={}; state.open={}; render();
});
document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("[data-scope]"); if(!b) return;
  state.scope = b.getAttribute("data-scope"); state.shown={}; state.open={}; render();
  window.scrollTo(0,0);
});
document.getElementById("chips").addEventListener("click", function(e){
  var b = e.target.closest(".chip"); if(!b) return;
  if(b.getAttribute("data-clear")){ state.facets={}; render(); return; }
  var k=b.getAttribute("data-fk"), v=b.getAttribute("data-fv");
  var arr = state.facets[k]||(state.facets[k]=[]);
  var i = arr.indexOf(v);
  if(i>=0) arr.splice(i,1); else arr.push(v);
  state.shown={}; state.open={}; render();
});
document.getElementById("out").addEventListener("click", function(e){
  var more = e.target.closest("[data-more]");
  if(more){ state.shown._ = (state.shown._||PAGE) + PAGE*2; render(); return; }
  var row = e.target.closest(".row"); if(!row) return;
  if(e.target.closest("a")) return;
  var i = row.getAttribute("data-i"), id=i;
  var ex = document.getElementById("d-"+id);
  if(ex){ ex.parentNode.removeChild(ex); state.open[id]=false; }
  else {
    var div = document.createElement("div");
    div.className="detail"; div.id="d-"+id;
    div.innerHTML = detailCase(rows[+id]);
    row.parentNode.insertBefore(div, row.nextSibling);
    state.open[id]=true;
  }
});
document.addEventListener("keydown", function(e){
  if(e.key==="/" && document.activeElement!==document.getElementById("q")){
    e.preventDefault(); document.getElementById("q").focus();
  }
});

var params = new URLSearchParams(location.search);
if(params.get("q")){
  state.q = params.get("q");
  state.tokens = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  document.getElementById("q").value = params.get("q");
}
if(params.get("item")){ state.scope = params.get("item"); }

if(!rows.length){
  document.getElementById("out").innerHTML =
    '<div class="empty"><b>还没有数据文件</b>本项目缺少 <code>查询数据/records.js</code>，重跑 <code>python build.py</code> 重新生成</div>';
  renderTabs();
} else {
  render();
}
if(window.innerWidth > 900) document.getElementById("q").focus();
})();
</script>
</body>
</html>
